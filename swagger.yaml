---
openapi: 3.0.0
info:
  title: API DE 31031669 - Tarea 3
  description: |
    API RESTful con autenticación JWT, gestión de productos y sistema transaccional de órdenes
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo

tags:
  - name: Public - Products
    description: Endpoints públicos para consulta de productos
  - name: Admin - Products  
    description: Gestión de productos (requiere autenticación)
  - name: Admin - Categories
    description: Gestión de categorías (requiere autenticación)
  - name: Admin - Tags
    description: Gestión de etiquetas (requiere autenticación)
  - name: Public - Info
    description: Información pública del sistema
  - name: Public - Auth
    description: Endpoints de autenticación
  - name: Admin - Users
    description: Gestión de usuarios
  - name: Orders
    description: Gestión de órdenes y checkout transaccional

components:
  schemas:
    # Esquemas existentes (Task 1 y 2)
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: "Adriana Padron"
        email:
          type: string
          example: "adri@example.com"
        cedula:
          type: string
          example: "12345678"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Iron Man Mark LXXXV"
        description:
          type: string
          example: "Funko Pop de Iron Man con traje de Endgame"
        price:
          type: number
          format: float
          example: 29.99
        stock:
          type: integer
          example: 50
        sku:
          type: string
          example: "AVG001"
        brand:
          type: string
          example: "Funko"
        publisher:
          type: string
          example: "Marvel"
        movie:
          type: string
          example: "Avengers: Endgame"
        character:
          type: string
          example: "Iron Man"
        edition:
          type: string
          example: "Standard"
        releaseYear:
          type: integer
          example: 2024
        isExclusive:
          type: boolean
          example: false
        slug:
          type: string
          example: "iron-man-mark-lxxxv-avg001"
        CategoryId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Avengers"
        description:
          type: string
          example: "Avengers movie collection"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    Tag:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "limited-edition"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    # Nuevos esquemas para Task 3
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 5
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELED, PAYMENT_FAILED]
          example: COMPLETED
        totalAmount:
          type: number
          format: float
          example: 199.99
        paymentMethod:
          type: string
          example: CreditCard
        transactionId:
          type: string
          example: txn_123456
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        orderId:
          type: integer
          example: 1
        productId:
          type: integer
          example: 10
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: float
          example: 99.99
        subtotal:
          type: number
          format: float
          example: 199.98
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    CreateOrderRequest:
      type: object
      required:
        - items
        - paymentMethod
        - paymentDetails
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: integer
                example: 10
              quantity:
                type: integer
                example: 2
        paymentMethod:
          type: string
          enum: [CreditCard]
          example: CreditCard
        paymentDetails:
          type: object
          required:
            - cardToken
          properties:
            cardToken:
              type: string
              example: tok_test_123456
            currency:
              type: string
              enum: [USD, EUR, COP]
              default: USD
              example: USD
    
    Error:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
          example: "Error description"
    
    Success:
      type: object
      properties:
        status:
          type: string
          example: "success"
        data:
          type: object
        message:
          type: string
  
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # Endpoints públicos de información
  /ping:
    get:
      tags:
        - Public - Info
      summary: Ping al servidor
      responses:
        '200':
          description: Respuesta exitosa

  /about:
    get:
      tags:
        - Public - Info
      summary: Información del desarrollador
      responses:
        '200':
          description: Información del desarrolladora
          content:
            application/json:
              example:
                status: "success"
                data:
                  nombreCompleto: "Cristhian Alfonzo Angyalbert Padrón Álvarez"
                  cedula: "31031669"
                  seccion: "1"

  # Autenticación
  /auth/register:
    post:
      tags:
        - Public - Auth
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombreCompleto
                - email
                - password
                - cedula
              properties:
                nombreCompleto:
                  type: string
                  example: "Adriana Padron"
                email:
                  type: string
                  example: "adri@example.com"
                password:
                  type: string
                  example: "password123"
                cedula:
                  type: string
                  example: "12345678"
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              example:
                status: "success"
                data:
                  user:
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    fullName: "Adriana Padron"
                    email: "adri@example.com"
                    cedula: "12345678"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  /auth/login:
    post:
      tags:
        - Public - Auth
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "adri@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              example:
                status: "success"
                data:
                  user:
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    fullName: "Adriana Padron"
                    email: "adri@example.com"
                    cedula: "12345678"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  # Gestión de usuarios (Admin)
  /users:
    get:
      tags:
        - Admin - Users
      summary: Obtener todos los usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              example:
                status: "success"
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    fullName: "Adriana Padron"
                    email: "adri@example.com"
                    cedula: "12345678"
                    createdAt: "2024-01-01T00:00:00.000Z"
                    updatedAt: "2024-01-01T00:00:00.000Z"
                  - id: "b2c3d4e5-f6g7-8901-bcde-f23456789012"
                    fullName: "Adriana Padron"
                    email: "adri@example.com"
                    cedula: "87654321"
                    createdAt: "2024-01-01T00:00:00.000Z"
                    updatedAt: "2024-01-01T00:00:00.000Z"

    post:
      tags:
        - Admin - Users
      summary: Crear nuevo usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
                - cedula
              properties:
                fullName:
                  type: string
                  example: "Adriana Padron"
                email:
                  type: string
                  example: "adri@example.com"
                password:
                  type: string
                  example: "password123"
                cedula:
                  type: string
                  example: "11223344"
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "c3d4e5f6-g7h8-9012-cdef-345678901234"
                  fullName: "Adriana Padron"
                  email: "adri@example.com"
                  cedula: "11223344"
                  createdAt: "2024-01-01T00:00:00.000Z"
                  updatedAt: "2024-01-01T00:00:00.000Z"

  /users/{id}:
    get:
      tags:
        - Admin - Users
      summary: Obtener usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  fullName: "Adriana Padron"
                  email: "adri@example.com"
                  cedula: "12345678"
                  createdAt: "2024-01-01T00:00:00.000Z"
                  updatedAt: "2024-01-01T00:00:00.000Z"

    put:
      tags:
        - Admin - Users
      summary: Actualizar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: "Adriana Padron"
                email:
                  type: string
                  example: "adri.p@example.com"
                cedula:
                  type: string
                  example: "12345678"
      responses:
        '200':
          description: Usuario actualizado exitosamente
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  fullName: "Adriana Padron"
                  email: "adri.p@example.com"
                  cedula: "12345678"
                  updatedAt: "2024-01-02T00:00:00.000Z"

    delete:
      tags:
        - Admin - Users
      summary: Eliminar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario eliminado exitosamente
          content:
            application/json:
              example:
                status: "success"
                data: null
                message: "User deleted successfully"

  # Gestión de categorías (Admin)
  /categories:
    get:
      tags:
        - Admin - Categories
      summary: Obtener todas las categorías
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '401':
          description: No autorizado

  /categories/{id}:
    get:
      tags:
        - Admin - Categories
      summary: Obtener categoría por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          description: Categoría no encontrada

    put:
      tags:
        - Admin - Categories
      summary: Actualizar categoría
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Categoría actualizada
        '404':
          description: Categoría no encontrada

    delete:
      tags:
        - Admin - Categories
      summary: Eliminar categoría
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría eliminada
        '404':
          description: Categoría no encontrada

  # Gestión de tags (Admin)
  /tags:
    get:
      tags:
        - Admin - Tags
      summary: Obtener todas las etiquetas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de etiquetas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tag'

    post:
      tags:
        - Admin - Tags
      summary: Crear una nueva etiqueta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Etiqueta creada
        '400':
          description: Datos inválidos

  /tags/{id}:
    get:
      tags:
        - Admin - Tags
      summary: Obtener etiqueta por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Etiqueta encontrada
        '404':
          description: Etiqueta no encontrada

    put:
      tags:
        - Admin - Tags
      summary: Actualizar etiqueta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Etiqueta actualizada
        '404':
          description: Etiqueta no encontrada

    delete:
      tags:
        - Admin - Tags
      summary: Eliminar etiqueta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Etiqueta eliminada
        '404':
          description: Etiqueta no encontrada

  # Gestión de productos
  /products:
    get:
      tags:
        - Public - Products
      summary: Búsqueda avanzada de productos con filtros
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: category
          in: query
          schema:
            type: integer
        - name: tags
          in: query
          schema:
            type: string
            description: IDs separados por coma
        - name: price_min
          in: query
          schema:
            type: number
        - name: price_max
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
        - name: movie
          in: query
          schema:
            type: string
        - name: character
          in: query
          schema:
            type: string
        - name: edition
          in: query
          schema:
            type: string
        - name: isExclusive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de productos paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items:
                              $ref: '#/components/schemas/Product'
                          pagination:
                            type: object
                            properties:
                              page:
                                type: integer
                              limit:
                                type: integer
                              total:
                                type: integer
                              pages:
                                type: integer

    post:
      tags:
        - Admin - Products
      summary: Crear nuevo producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - sku
                - movie
                - character
                - CategoryId
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                sku:
                  type: string
                brand:
                  type: string
                publisher:
                  type: string
                movie:
                  type: string
                character:
                  type: string
                edition:
                  type: string
                releaseYear:
                  type: integer
                isExclusive:
                  type: boolean
                CategoryId:
                  type: integer
                tags:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: Producto creado
        '400':
          description: Datos inválidos

  /products/{id}:
    get:
      tags:
        - Admin - Products
      summary: Obtener producto por ID (vista admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
        '404':
          description: Producto no encontrada

    put:
      tags:
        - Admin - Products
      summary: Actualizar producto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                sku:
                  type: string
                brand:
                  type: string
                publisher:
                  type: string
                movie:
                  type: string
                character:
                  type: string
                edition:
                  type: string
                releaseYear:
                  type: integer
                isExclusive:
                  type: boolean
                CategoryId:
                  type: integer
                tags:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Producto actualizado
        '404':
          description: Producto no encontrada

    delete:
      tags:
        - Admin - Products
      summary: Eliminar producto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto eliminado
        '404':
          description: Producto no encontrada

  # Ruta pública con self-healing
  /p/{id}-{slug}:
    get:
      tags:
        - Public - Products
      summary: Obtener producto por ID y slug (URL self-healing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '301':
          description: Redirección a URL correcta (self-healing)
        '404':
          description: Producto no encontrado

  # ============================================
  # NUEVOS ENDPOINTS PARA TASK 3 - GESTIÓN DE ÓRDENES
  # ============================================

  /orders:
    post:
      tags:
        - Orders
      summary: Crear una nueva orden y procesar pago (Transacción atómica)
      description: |
        Crea una orden, procesa el pago y actualiza el stock en una sola transacción atómica.
        Si falla el pago o no hay stock, se realiza rollback completo.
        ### Operación Transaccional:
        1. Verificación de stock para todos los productos
        2. Cálculo del total de la orden
        3. Procesamiento del pago con API externa
        4. Actualización de stock (solo si pago es exitoso)
        5. Creación de la orden y sus items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Orden creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Datos de solicitud inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado - Token JWT requerido
        '402':
          description: Pago rechazado por el proveedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto - Stock insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Orders
      summary: Obtener historial de órdenes del usuario autenticado
      description: Retorna las órdenes del usuario autenticado con paginación
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Elementos por página
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Historial de órdenes obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          totalItems:
                            type: integer
                          totalPages:
                            type: integer
        '401':
          description: No autenticado - Token JWT requerido
        '500':
          description: Error interno del servidor

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtener detalle de una orden específica
      description: Retorna los detalles de una orden solo si pertenece al usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la orden
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la orden obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '401':
          description: No autenticado - Token JWT requerido
        '404':
          description: Orden no encontrada o no pertenece al usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'